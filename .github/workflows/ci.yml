name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Install dependencies
        run: make setup
      - name: make check (lint, format, types, import contracts, tests)
        run: make check
      - name: requirements.txt matches uv.lock
        run: make requirements-check
      - name: Fixtures regenerate byte-identically
        run: make fixtures-check
      - name: JSON schemas current and versioned
        run: make schemas-check SCHEMA_BASE=HEAD^
      - name: Exported bundle verifies in a clean venv (T-ART-03)
        run: |
          uv run --frozen tabpilot run fixtures/datasets/binary_basic.csv --target Churn \
            --out "$RUNNER_TEMP/run" --budget-s 240 --tuning-mode trials --trials 2 \
            --models linear,lightgbm
          scripts/verify_bundle_clean_venv.sh "$(ls "$RUNNER_TEMP"/run/tabpilot_*.zip)" \
            "$(uv python find 3.11)"
