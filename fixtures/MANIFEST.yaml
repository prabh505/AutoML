about: Ground truth for every committed fixture. Generated by fixtures/make_fixtures.py; do not edit by
  hand. Column names are given normalized (§8.4).
plan_context:
  dataset: datasets/binary_basic.csv
  profile: hosted
  task: binary
  target: churn
  excluded:
  - customer_id
  feature_columns:
  - age
  - income
  - tenure_months
  - monthly_charges
  - contract
  - region
  - has_partner
  - signup_date
  - num_support_calls
  - noise_1
  available_models:
  - linear
  - random_forest
  - lightgbm
not_committed:
  datasets/hosted_limit.csv: make_fixtures.generate_hosted_limit(path); 100,000 x 30; T-PERF-02
files:
  datasets/binary_basic.csv:
    purpose: Mixed types; holdout path (n_valid ≥ 2,000)
    shape:
    - 2500
    - 12
    target: Churn
    expected_task: binary
    positive_label: 'Yes'
    generating_process: logit = -1.6 + 1.4·[contract=month_to_month] - 0.035·tenure + 0.02·(monthly-70)
      + 0.30·support_calls + 0.005·(age-50); region, has_partner, noise_1, signup_date, income carry no
      signal
    informative:
    - contract
    - tenure_months
    - monthly_charges
    - num_support_calls
    - age
    noise:
    - region
    - has_partner
    - noise_1
    - signup_date
    - income
    expected_semantic_types:
      customer_id: identifier
      age: numeric
      income: numeric
      tenure_months: numeric
      monthly_charges: numeric
      contract: categorical
      region: categorical
      has_partner: boolean
      signup_date: datetime
      num_support_calls: numeric (hint possibly_categorical)
      noise_1: numeric
    expected_exclusions:
      customer_id: identifier
    expected_warnings: []
    expected_holdout: true
    notes: income exactly 6% missing → missing indicator (A-006, ≥ 5%)
    tests:
    - T-E2E-01
    - T-ING-09..13
    - T-PRE-*
    - T-TRN-01
    - T-ART-04
  datasets/binary_imbalanced.csv:
    purpose: 'Imbalance: exactly 3% positive → AP primary metric, class weights'
    shape:
    - 5000
    - 10
    target: is_fraud
    expected_task: binary
    positive_label: '1'
    generating_process: top 150 rows by latent = 1.2·f1 + 0.8·f2 - 0.6·f3 + N(0,1)
    informative:
    - f1
    - f2
    - f3
    noise:
    - f4
    - f5
    - f6
    - f7
    - f8
    - channel
    expected_default_metric: average_precision
    expected_warnings:
    - W-IMBALANCE
    expected_holdout: true
    tests:
    - T-TGT-07..10
    - T-TRN-01
    - §10.2 metric rule
  datasets/binary_small.csv:
    purpose: No-holdout path; repeated 3x5 CV; ≤ 20 trials per model (A-003)
    shape:
    - 180
    - 6
    target: target
    expected_task: binary
    generating_process: logit = 1.5·x1 - 1.0·x2 + 0.8·[level=high]; x3, noise carry none
    informative:
    - x1
    - x2
    - level
    noise:
    - x3
    - noise
    expected_semantic_types:
      x1: numeric
      x2: numeric
      x3: numeric
      level: categorical
      noise: numeric
    expected_warnings:
    - W-SMALL-DATA
    - W-NO-HOLDOUT
    expected_holdout: false
    expected_split:
      strategy: repeated_stratified_kfold
      k: 5
      n_repeats: 3
    tests:
    - T-LEAK-01
    - T-EVL-*
    - P09 CLI no-holdout run
  datasets/grouped.csv:
    purpose: 'Group splitting: 300 patients x 10 visits; group-level signal'
    shape:
    - 3000
    - 8
    target: readmitted
    expected_task: binary
    group_column: patient_id
    n_groups: 300
    generating_process: logit = u_g + 0.5·x1 with u_g ~ N(0, 3²) per patient; trait_a/b are per-patient
      fingerprints independent of u_g. Models that memorize patients via traits look good under random
      CV and not under group CV
    informative:
    - x1
    noise:
    - x2
    - noise
    - visit_num
    group_fingerprints:
    - trait_a
    - trait_b
    expected_semantic_types:
      patient_id: 'numeric (not identifier: distinct ratio 0.1)'
    expected_warnings:
    - W-GROUP-SUSPECTED
    tests:
    - T-LEAK-04
    - US-05
  datasets/leaky_binary.csv:
    purpose: 'Leakage scan: target copy (near-deterministic) + legitimate strong predictor'
    shape:
    - 2500
    - 8
    target: defaulted
    expected_task: binary
    generating_process: status_code = defaulted with 12 flips (0.48%); risk_score = 2.15·defaulted + N(0,1);
      w1 = 0.3·defaulted + N(0,1); others noise
    expected_leakage:
      status_code:
        level: near_deterministic
        univariate_auc_approx: 0.995
        action: 'excluded (A-002: ≥ 0.95)'
      risk_score:
        level: strong
        univariate_auc_range:
        - 0.9
        - 0.95
        action: 'kept + W-LEAK-STRONG (A-002: ≥ 0.90)'
    expected_warnings:
    - W-LEAK-NEAR-DETERMINISTIC
    - W-LEAK-STRONG
    tests:
    - T-LEAK-05
    - T-LEAK-06
  datasets/multiclass_basic.csv:
    purpose: Multiclass path (5 classes, string labels)
    shape:
    - 3000
    - 10
    target: species
    expected_task: multiclass
    generating_process: argmax(X·W + Gumbel + 0.6·[zone=north]·class_index); W rows for m5..m7 are zero
    informative:
    - m1
    - m2
    - m3
    - m4
    - zone
    noise:
    - m5
    - m6
    - m7
    - score_band
    expected_semantic_types:
      zone: categorical
      score_band: numeric (hint possibly_categorical)
    expected_warnings: []
    expected_holdout: true
    tests:
    - T-E2E-02
    - T-TRN-01
  datasets/multiclass_rare.csv:
    purpose: 'K reduction: one class has 3 rows → K = max(2, 3) = 3 (§11.3)'
    shape:
    - 600
    - 6
    target: color
    expected_task: multiclass
    class_counts:
      red: 250
      green: 200
      blue: 147
      rare: 3
    generating_process: a = class shift + N(0,1); b, c, d, e carry none
    informative:
    - a
    noise:
    - b
    - c
    - d
    - e
    expected_holdout: false
    expected_split:
      k: 3
      n_repeats: 3
    expected_warnings:
    - W-IMBALANCE
    - W-NO-HOLDOUT
    tests:
    - T-TGT-*
    - P05 K reduction
  datasets/quality_issues.csv:
    purpose: Every §8.6 check and US-04 warning
    shape:
    - 1000
    - 15
    target: outcome
    expected_task: binary
    generating_process: 975 base rows + 20 exact duplicates + 5 feature-duplicates with flipped outcome;
      outcome independent of features
    expected_semantic_types:
      record_id: identifier (975/1000 distinct, ID name)
      constant_col: constant
      missing_97: numeric
      missing_60: numeric
      near_constant: categorical
      high_card_cat: categorical
      very_high_card: categorical
      mixed_type: numeric
      inf_values: numeric
      free_text: text
      flag_yn: boolean
      zip_code: numeric (hint possibly_categorical; 12 distinct)
      event_date: datetime
      amount: numeric
    expected_exclusions:
      record_id: identifier
      constant_col: constant
      missing_97: missing_rate > 95%
      free_text: text
    expected_counts:
      mixed_type_coerced: 20
      inf_values_converted: 5
      duplicate_rows: 20
      conflicting_duplicate_rows: 5
    expected_warnings:
    - 'W-COERCED (mixed_type: 20)'
    - 'W-INF (inf_values: 5)'
    - W-HIGH-MISSING (missing_60)
    - W-DUPLICATES (20; > 1% → duplicate grouping)
    - W-CONFLICTING-DUPLICATES (5)
    - near-constant warning (near_constant; code to add, PI-42)
    - very-high-cardinality warning (very_high_card; code to add, PI-42)
    expected_encoding:
      high_card_cat: high-cardinality (> 50 distinct)
    tests:
    - T-ING-09..13
    - US-04
  datasets/regression_basic.csv:
    purpose: Regression path
    shape:
    - 3000
    - 10
    target: price
    expected_task: regression
    generating_process: price = 200 + 40·r1 - 25·r2 + 15·r3² + {villa:80, house:30, flat:0} + N(0, 20²)
    informative:
    - r1
    - r2
    - r3
    - kind
    noise:
    - r4
    - r5
    - r6
    - r7
    - built
    expected_semantic_types:
      kind: categorical
      built: datetime
    expected_warnings: []
    expected_holdout: true
    tests:
    - T-E2E-03
    - T-TRN-01
  datasets/regression_skewed.csv:
    purpose: Lognormal target → rule-based plan picks log1p (skew > 2, target ≥ 0)
    shape:
    - 2500
    - 8
    target: claim_amount
    expected_task: regression
    generating_process: claim = exp(3 + 0.9·s1 - 0.5·s2 + N(0, 0.6²))
    informative:
    - s1
    - s2
    noise:
    - s3
    - s4
    - s5
    - s6
    - segment
    expected_target_skew_gt: 2.0
    expected_target_transform: log1p
    expected_warnings: []
    expected_holdout: true
    tests:
    - T-PLN-09
    - §15.1 TTR
  datasets/wide.csv:
    purpose: Compact-profile truncation (> 150 detailed columns) and W-WIDE
    shape:
    - 500
    - 190
    target: label
    expected_task: binary
    generating_process: logit = 1.2·v001 - 1.2·v002 + 0.8·v003; 186 noise columns
    informative:
    - v001
    - v002
    - v003
    expected_warnings:
    - W-WIDE
    - W-NO-HOLDOUT
    expected_compact_profile:
      max_chars: 14000
      rest_summary_present: true
    tests:
    - T-PRF-03
    - T-PRIV-01
