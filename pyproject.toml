[project]
name = "tabpilot"
version = "0.1.0"
description = "TabPilot: LLM-assisted AutoML for tabular data (binary, multiclass, regression)."
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Prabhpreet Singh" }]
requires-python = ">=3.11,<3.12"
# Core runtime dependencies: PRD §34.2 (+ pyyaml, DEC-020).
dependencies = [
    "streamlit>=1.40",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    # TargetEncoder(cv), OneHotEncoder(min_frequency, max_categories),
    # set_output(transform="pandas"), StratifiedGroupKFold.
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "optuna>=4.0",
    "shap>=0.46",
    "langgraph>=0.2",
    "pydantic>=2.7",
    "openai>=1.40",
    "charset-normalizer>=3.3",
    "psutil>=5.9",
    "joblib>=1.4",
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "python-ulid>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.0"]
catboost = ["catboost>=1.2"]
mlflow = ["mlflow>=2.14"]
bench = ["flaml[automl]>=2.2"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "pytest-socket>=0.7",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.1",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
    # Type stubs for mypy (DEC-020).
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
    "types-psutil>=5.9",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabpilot", "src/tabpilot_runtime"]

[tool.uv]
default-groups = []

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Markdown (PRD, prompts, ADRs) is never reformatted: docs/PRD.md is immutable.
extend-exclude = ["*.md", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "S", "PT", "C4", "PL", "T20"]
ignore = [
    "PLR0913",  # pipeline factories take many explicit arguments by design
    "PLR2004",  # PRD thresholds are written inline with § references
    "RUF001", "RUF002", "RUF003",  # PRD notation (–, ≥, →, ×) in strings, docstrings, comments
    "N803", "N806",  # scikit-learn convention: X, y, W for matrices
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S603", "S607", "E501", "N818", "RUF012", "PLW0108", "N802"]  # N802: PRD test IDs
# Fixture generator: ML naming (X, W) and literal data tables.
"fixtures/**" = ["E501"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["tabpilot", "tabpilot_runtime"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

# NFR-MNT-01: strict for schemas, evaluation, splitting, llm.
[[tool.mypy.overrides]]
module = ["tabpilot.schemas.*", "tabpilot.evaluation.*", "tabpilot.splitting.*", "tabpilot.llm.*"]
strict = true

[[tool.mypy.overrides]]
module = ["pyarrow.*", "charset_normalizer.*", "lightgbm.*", "shap.*", "optuna.*", "xgboost.*", "catboost.*", "sklearn.*", "joblib.*", "flaml.*", "mlflow.*", "langgraph.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--import-mode=importlib",
    "-m", "not perf and not live and not slow",
    "--disable-socket",
    "--allow-unix-socket",
]
markers = [
    "unit: pure functions, transformers, validators, metrics",
    "integration: stage combinations on fixtures with LLM stubs",
    "e2e: full worker runs on fixtures",
    "security: static scans, malicious fixtures, injection tests",
    "perf: hosted-emulation performance tests (opt-in)",
    "ui: Streamlit AppTest flows",
    "slow: long-running tests (opt-in)",
    "live: real LLM provider calls; needs API keys and network (opt-in)",
]
timeout = 300
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["tabpilot", "tabpilot_runtime"]
branch = true

[tool.coverage.report]
# NFR-MNT-02: overall ≥ 80%; per-module thresholds are checked by owning prompts.
fail_under = 80
show_missing = true
skip_empty = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_packages = ["tabpilot", "tabpilot_runtime"]
include_external_packages = true

# PRD §25.4 rule 1: ui → runtime → orchestration → stage modules → schemas.
[[tool.importlinter.contracts]]
name = "R1 layering: ui > runtime > orchestration > stage modules > config/logging > schemas"
type = "layers"
containers = ["tabpilot"]
layers = [
    "ui",
    "runtime",
    "orchestration",
    "ingestion : splitting : profiling : planning : llm : features : preprocessing : models : training : tuning : evaluation : reflection : ensembling : explain : reporting : export : resources : tracking",
    "(config) : (logging)",  # created in P02; optional until then
    "schemas",
]

# PRD §25.4 rule 2 (as clarified by PI-13): only the finalizer path may reach the holdout guard.
[[tool.importlinter.contracts]]
name = "R2 holdout guard: only evaluation and orchestration may import tabpilot.splitting (P05 narrows this to splitting.guard)"
type = "forbidden"
source_modules = [
    "tabpilot.ui", "tabpilot.runtime", "tabpilot.ingestion", "tabpilot.profiling",
    "tabpilot.planning", "tabpilot.llm", "tabpilot.features", "tabpilot.preprocessing",
    "tabpilot.models", "tabpilot.training", "tabpilot.tuning", "tabpilot.reflection",
    "tabpilot.ensembling", "tabpilot.explain", "tabpilot.reporting", "tabpilot.export",
    "tabpilot.resources", "tabpilot.tracking", "tabpilot.schemas", "tabpilot_runtime",
]
forbidden_modules = ["tabpilot.splitting"]
allow_indirect_imports = true

# PRD §25.4 rule 3.
[[tool.importlinter.contracts]]
name = "R3 llm does not import pandas"
type = "forbidden"
source_modules = ["tabpilot.llm"]
forbidden_modules = ["pandas"]

# Amendment A-001 / ADR-0002.
[[tool.importlinter.contracts]]
name = "R5 tabpilot_runtime is standalone (never imports tabpilot)"
type = "forbidden"
source_modules = ["tabpilot_runtime"]
forbidden_modules = ["tabpilot"]

# schemas depends only on pydantic (PRD §25.2).
[[tool.importlinter.contracts]]
name = "R6 schemas imports no other tabpilot module"
type = "forbidden"
source_modules = ["tabpilot.schemas"]
forbidden_modules = [
    "tabpilot.ui", "tabpilot.runtime", "tabpilot.orchestration", "tabpilot.ingestion",
    "tabpilot.splitting", "tabpilot.profiling", "tabpilot.planning", "tabpilot.llm",
    "tabpilot.features", "tabpilot.preprocessing", "tabpilot.models", "tabpilot.training",
    "tabpilot.tuning", "tabpilot.evaluation", "tabpilot.reflection", "tabpilot.ensembling",
    "tabpilot.explain", "tabpilot.reporting", "tabpilot.export", "tabpilot.resources",
    "tabpilot.tracking", "tabpilot_runtime",
]
